site_name: Monsta Choppa Dev Docs
docs_dir: Docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.annotate
    - toc.integrate

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - attr_list
  - md_in_html

repo_url: https://github.com/SBUplakankus/monsta-choppa-vr

nav:
  - PC Version:
    - Overview: pc/index.md
    - Sprint:
      - Week 1: pc/sprint/week-1.md
      - Week 2: pc/sprint/week-2.md
      - Week 3: pc/sprint/week-3.md
      - Week 4: pc/sprint/week-4.md
    - Architecture:
      - Overview: pc/architecture/overview.md
      - Shared Systems: pc/architecture/shared-systems.md
    - Systems:
      - Player: pc/systems/player.md
      - Enemies: pc/systems/enemies.md
      - Weapons: pc/systems/weapons.md
      - Rooms: pc/systems/rooms.md
      - Shop: pc/systems/shop.md
      - UI: pc/systems/ui.md
    - Rebuild Reference:
      - VR to PC Map: pc/rebuild/vr-to-pc-map.md
      - New Scripts: pc/rebuild/new-scripts.md
  - VR Archive:
    - Architecture:
      - Overview: archive/vr/architecture/overview.md
      - Database Pattern: archive/vr/architecture/database-pattern.md
      - Event System: archive/vr/architecture/event-system.md
    - Systems:
      - Weapons: archive/vr/systems/weapons.md
      - Enemies: archive/vr/systems/enemies.md
      - UI: archive/vr/systems/user-interface.md
      - Save Data: archive/vr/systems/save-data.md
    - VR Specific:
      - Performance: archive/vr/vr/performance.md
      - Comfort: archive/vr/vr/comfort.md
      - Spacewarp: archive/vr/vr/spacewarp.md
    - Future (Archived):
      - Project Status: archive/vr/future/project-status.md
      - Original Roadmap: archive/vr/future/roadmap.md
      - AI Context Reference: archive/vr/future/ai-context-reference.md
